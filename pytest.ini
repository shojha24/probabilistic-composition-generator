[pytest]
# See tests/requirements.txt for the pytest-xdist dependency this relies on.
#
# `--dist=loadscope` groups tests by their containing module onto the same
# worker process, which matters here specifically because several test
# files use a module-scoped fixture (e.g. `default_run` / `full_corpus_run`
# in test_pop_piano.py / test_pop_guitar.py) that voices the shared corpus
# once and caches the result for every test function in that file. Plain
# `-n auto` load-balancing can split a module's tests across workers, which
# defeats that caching (each worker recomputes the fixture independently)
# -- loadscope keeps the caching benefit while still parallelizing across
# files/modules.
addopts = -n auto --dist=loadscope
